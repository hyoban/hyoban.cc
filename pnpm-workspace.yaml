allowBuilds:
  bufferutil: false
  esbuild: true
  ffmpeg-static: true
  sharp: true
  utf-8-validate: false
  workerd: true

minimumReleaseAge: 0

onlyBuiltDependencies:
  - esbuild
  - ffmpeg-static
  - sharp
  - workerd
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
