name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Astro's check loads the site's config, which reads the API like a build.
      - run: pnpm check
        env:
          MOMENTS_API_TOKEN: ${{ secrets.MOMENTS_API_TOKEN }}
      # The records are the API's alone: the audit reads its export, and the build fetches it.
      - name: Export the API into data/
        env:
          MOMENTS_API_TOKEN: ${{ secrets.MOMENTS_API_TOKEN }}
        run: pnpm data:export
      - name: Audit Moments
        run: pnpm moments:audit
      # With CI set the build draws every share card; keep them between runs, as Workers
      # Builds does, so a run draws only the cards that changed. The build prunes unused ones.
      - uses: actions/cache@v6
        with:
          path: |
            apps/web/node_modules/.astro/share-cards
            apps/web/node_modules/.astro/share-assets
          key: share-cards-${{ github.run_id }}
          restore-keys: share-cards-
      - run: pnpm build
        env:
          MOMENTS_API_TOKEN: ${{ secrets.MOMENTS_API_TOKEN }}
      - name: Audit remote Moment assets
        if: github.event_name == 'schedule'
        run: pnpm moments:audit --remote
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
