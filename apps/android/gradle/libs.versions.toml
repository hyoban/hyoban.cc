[versions]
# Exposes the shell user service used to read the physical side key, without root.
shizuku = "13.1.5"
playLocation = "21.4.0"
agp = "9.5.0"
# Newer than the Kotlin the Android Gradle plugin bundles, so the root build file pins it;
# the compiler plugins and kotlin-test must match it.
kotlin = "2.4.21"
composeBom = "2026.09.00"
# Compose Multiplatform, for the code shared with the Mac app; built on the same Compose 1.12 as the BOM.
composeMultiplatform = "1.12.2"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
coroutines = "1.11.0"
lifecycle = "2.11.0"
navigationCompose = "2.10.2"
serialization = "1.12.0"
coil = "3.6.3"
# No longer moved by the Compose BOM, so pinned to its last release.
# Ahead of the BOM's 1.4 for the flexible top app bars, whose subtitle a pushed page's bar
# needs; it is built on the same Compose 1.12 as the BOM.
junit = "4.13.2"
testRunner = "1.7.0"
maplibreCompose = "0.21.0-hyoban.1"
media3 = "1.11.1"
# The OkHttp Coil and Media3 are built against; the app shares one client with them.
okhttp = "4.12.0"
telephoto = "0.19.0"
capsule = "2.1.3"
# Blurs the page under the top bar and the tab bar, more toward the screen's edge.
haze = "2.0.1"
glance = "1.2.0"
# Glance asks for WorkManager 2.7, whose Room R8 strips the database class from; a current one keeps it.
work = "2.12.0"
# Reads a photo's time and place when a Moment is written on the phone.
exifinterface = "1.4.2"
# Streams the fog's regions in; the one MapLibre already brings, so the APK carries no more.
gson = "2.10.1"
# Opens iCost's backup, a zip sealed with WinZip's AES, which the platform's zip can't read.
zip4j = "2.11.5"
# Lets the ledger's tests read an iCost backup's database on the JVM, where Android's SQLite isn't.
sqliteJdbc = "3.46.1.3"
# The copy of the API's records reads the platform's SQLite through androidx.sqlite's driver;
# 2.5.0 is the androidx.sqlite WorkManager's Room brings.
sqlite = "2.5.0"

[libraries]
# Reads a photo's time and place from its file on the Mac, as ExifInterface does on the phone.
metadata-extractor = { group = "com.drewnoakes", name = "metadata-extractor", version = "2.19.0" }
# The lunar calendar on the Mac, as Android's own ICU gives it on the phone.
icu4j = { group = "com.ibm.icu", name = "icu4j", version = "76.1" }
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playLocation" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-multiplatform-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "composeMultiplatform" }
compose-multiplatform-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "composeMultiplatform" }
compose-multiplatform-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "composeMultiplatform" }
compose-multiplatform-resources = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "composeMultiplatform" }
# Skiko's native library for the Mac the app is built on comes with this one.
compose-multiplatform-desktop = { group = "org.jetbrains.compose.desktop", name = "desktop-jvm-macos-arm64", version.ref = "composeMultiplatform" }
# Dispatchers.Main on the desktop.
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
coil-video = { group = "io.coil-kt.coil3", name = "coil-video", version.ref = "coil" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
maplibre-compose = { group = "org.maplibre.compose", name = "maplibre-compose", version.ref = "maplibreCompose" }
# The OpenGL ES runtime: Vulkan's arm64 library is about 2 MB larger, 0.7 MB in the APK.
maplibre-compose-runtime-opengl-android = { group = "org.maplibre.compose", name = "maplibre-compose-runtime-opengl-android", version.ref = "maplibreCompose" }
maplibre-compose-runtime-metal-macos-arm64 = { group = "org.maplibre.compose", name = "maplibre-compose-runtime-metal-macos-arm64", version.ref = "maplibreCompose" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-ui-compose = { group = "androidx.media3", name = "media3-ui-compose", version.ref = "media3" }
# Lifecycle's Compose pieces as JetBrains publishes them for the desktop too; on Android they are androidx's own.
lifecycle-runtime-compose-multiplatform = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose-multiplatform = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
telephoto-zoomable = { group = "me.saket.telephoto", name = "zoomable", version.ref = "telephoto" }
capsule = { group = "io.github.kyant0", name = "capsule", version.ref = "capsule" }
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
haze-blur = { group = "dev.chrisbanes.haze", name = "haze-blur", version.ref = "haze" }
glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
zip4j = { group = "net.lingala.zip4j", name = "zip4j", version.ref = "zip4j" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqliteJdbc" }
sqlite = { group = "androidx.sqlite", name = "sqlite", version.ref = "sqlite" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
# SQLite itself for the Mac, where the system's isn't the app's to open through androidx.sqlite.
sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }
sqlite-framework = { group = "androidx.sqlite", name = "sqlite-framework", version.ref = "sqlite" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "testRunner" }
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
